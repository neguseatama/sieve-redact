name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public text watch
        run: python tools/check_public_text.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: The artifacts carry the release version
        # a tag run compares the tag with the artifacts; a manual trial
        # run has no tag, so the artifacts are compared with VERSION
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="$(python3 -c 'import sieve_redact; print(sieve_redact.VERSION)')"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -f "dist/sieve_redact-${version}.tar.gz"
          test -f "dist/sieve_redact-${version}-py3-none-any.whl"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Extract the CHANGELOG section for the release
        run: |
          python3 tools/extract_changelog.py "${RELEASE_VERSION}" > release_body.md

      - name: Check the release body
        # one finding stops the release before anything is published
        run: python tools/check_public_text.py --text release_body.md

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum sieve_redact-*.tar.gz sieve_redact-*.whl > SHA256SUMS.txt

      - name: Keep the trial outputs as workflow artifacts
        # the deliverable of a trial run: the same outputs the tag run
        # would attach to the GitHub Release, left as run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-outputs-${{ github.run_number }}
          path: |
            dist/
            release_body.md

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/sieve_redact-*.tar.gz
            dist/sieve_redact-*.whl

      - name: Attach the assets and the body to the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sieve_redact-*.tar.gz
            dist/sieve_redact-*.whl
            dist/SHA256SUMS.txt
          body_path: release_body.md
