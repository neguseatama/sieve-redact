name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public text watch
        run: python tools/check_public_text.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: The artifacts carry the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/sieve_redact-${version}.tar.gz"
          test -f "dist/sieve_redact-${version}-py3-none-any.whl"

      - name: Extract the CHANGELOG section for the tag
        run: |
          python3 tools/extract_changelog.py "${GITHUB_REF_NAME#v}" > release_body.md

      - name: Check the release body
        # one finding stops the release before anything is published
        run: python tools/check_public_text.py --text release_body.md

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum sieve_redact-*.tar.gz sieve_redact-*.whl > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/sieve_redact-*.tar.gz
            dist/sieve_redact-*.whl

      - name: Attach the assets and the body to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sieve_redact-*.tar.gz
            dist/sieve_redact-*.whl
            dist/SHA256SUMS.txt
          body_path: release_body.md
