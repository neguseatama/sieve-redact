name: Sieve Redact CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          # the current ubuntu-latest image (Ubuntu 26.04) carries no
          # Python 3.9 build, so the 3.9 floor runs on ubuntu-22.04
          - os: ubuntu-22.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with image extras
        # setuptools provisions the sdist self-containment check: the
        # hosted Python 3.12 images carry pip only
        run: pip install setuptools ".[image]"
      - name: Public text watch
        run: python tools/check_public_text.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
