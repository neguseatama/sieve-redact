[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-redact"
dynamic = ["version"]
description = "Deterministic text and image masking — byte/byte-pixel integrity outside matched regions"
readme = "README.md"
authors = [{ name = "Kai IWASAKI" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters"
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/neguseatama/sieve-redact"
Repository = "https://github.com/neguseatama/sieve-redact.git"
"Bug Tracker" = "https://github.com/neguseatama/sieve-redact/issues"

[project.optional-dependencies]
image = ["Pillow>=10.0"]

[project.scripts]
sieve-redact = "sieve_redact:main"

[tool.setuptools]
py-modules = ["sieve_redact"]

[tool.setuptools.dynamic]
version = { attr = "sieve_redact.VERSION" }
